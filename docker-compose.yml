services:
  postgres:
    image: postgres:16-alpine
    container_name: jabali-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jabali
      POSTGRES_PASSWORD: jabali_dev_pw
      POSTGRES_DB: jabali
    ports:
      # 5433 is commonly taken by other local projects; 5439 avoids the clash.
      - "5439:5432"
    volumes:
      - jabali_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jabali -d jabali"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    # Dev-only mail catcher: nothing is delivered to real addresses. SMTP on 1025, inbox UI and API on 8025.
    image: axllent/mailpit:latest
    container_name: jabali-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  jabali_pgdata:
